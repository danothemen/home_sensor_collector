daemon off;

worker_processes  1;

error_log /dev/stdout info;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    server {
        listen       80;
        server_name  localhost;

        # Reverse-proxied at oonthego.blog/home_sensor_collector/ — everything below is
        # prefixed to match (see frontend/package.json "homepage" and
        # ../everything/nginx for the outer proxy that forwards this prefix here).

        location = /home_sensor_collector {
            return 301 /home_sensor_collector/;
        }

        # Proxy API requests to the retriever service (must be before / location).
        # retriever's own Express routes are already mounted at /api/... at root,
        # so the prefix is stripped here, not forwarded.
        location /home_sensor_collector/api/ {
            proxy_pass http://retriever:3001/api/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Serve static files (JS, CSS, images, etc.)
        location /home_sensor_collector/static/ {
            alias /www/static/home_sensor_collector/static/;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # HLS stream location — files are written by the rtmp block below to /tmp/hls,
        # independent of the prefix, so this uses alias (not root) to strip it.
        location /home_sensor_collector/hls/ {
            types {
                application/vnd.apple.mpegurl m3u8;
                video/mp2t ts;
            }
            alias /tmp/hls/;
            add_header Cache-Control no-cache;
        }

        # Serve the React App (must be last to catch all other routes)
        location /home_sensor_collector/ {
            root   /www/static;
            index  index.html index.htm;
            try_files $uri $uri/ /home_sensor_collector/index.html;
        }

        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   /www/static/home_sensor_collector;
        }
    }
}

rtmp {
    server {
        listen 1935;
        chunk_size 4096;

        application live {
            live on;
            record off;

            # HLS settings
            hls on;
            hls_path /tmp/hls;
            hls_fragment 3;
            hls_playlist_length 60;
        }
    }
}
